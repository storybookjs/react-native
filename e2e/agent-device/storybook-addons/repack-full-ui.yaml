appId: ${APP_ID}
name: Repack example Storybook full UI addons
---
- stopApp: ${APP_ID}
- launchApp
- waitForAnimationToEnd

# Actions: full UI only logs while the Actions panel is open.
- runScript:
    file: 'select-story-sync.js'
    env:
      STORY_ID: 'actionexample-actions--basic'
- waitForAnimationToEnd
- assertVisible: 'ActionExample/Actions/Basic'
- runFlow:
    when:
      notVisible: 'Actions'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Actions'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Actions'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Actions'
    timeout: 10000
- tapOn:
    label: 'Actions'
- assertVisible: 'CLEAR'
- tapOn:
    label: 'Press me!'
- assertVisible: '▶, onPress, : [...]'
- takeScreenshot: 'repack-actions'
- tapOn:
    label: 'Close addons panel'

# Controls: change a radio control and verify the rendered story updates.
- runScript:
    file: 'select-story-sync.js'
    env:
      STORY_ID: 'controlexamples-controlexample--example'
- waitForAnimationToEnd
- assertVisible: 'ControlExamples/ControlExample/Example'
- runFlow:
    when:
      notVisible: 'Controls'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Controls'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Controls'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Controls'
    timeout: 10000
- tapOn:
    label: 'Controls'
- assertVisible: 'otherFruit'
- tapOn:
    label: 'kiwi'
- tapOn:
    label: 'Close addons panel'
- assertVisible: 'kiwi'
- takeScreenshot: 'repack-controls'

# Backgrounds: full UI exposes configured background options.
- runScript:
    file: 'select-story-sync.js'
    env:
      STORY_ID: 'backgroundexample-backgroundcsf--basic'
- waitForAnimationToEnd
- assertVisible: 'BackgroundExample/BackgroundCsf/Basic'
- runFlow:
    when:
      notVisible: 'Backgrounds'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Backgrounds'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: 'Backgrounds'
    commands:
      - tapOn:
          label: 'Open addons panel'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Backgrounds'
    timeout: 10000
- tapOn:
    label: 'Backgrounds'
- assertVisible: 'dark'
- assertVisible: 'plain'
- assertVisible: 'app'
- takeScreenshot: 'repack-backgrounds'
