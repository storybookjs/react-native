name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - canary
          - next
          - latest

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # --- Canary Release ---
      - name: Version (canary snapshot)
        if: inputs.release_type == 'canary'
        run: pnpm changeset version --snapshot canary

      - name: Publish (canary)
        if: inputs.release_type == 'canary'
        run: pnpm changeset publish --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Next Release ---
      - name: Version (next)
        if: inputs.release_type == 'next'
        run: |
          pnpm changeset pre enter next
          pnpm changeset version

      - name: Publish (next)
        if: inputs.release_type == 'next'
        run: pnpm changeset publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit & push version changes (next)
        if: inputs.release_type == 'next'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages (next)" --allow-empty
          git push

      # --- Latest (stable) Release ---
      - name: Version (latest)
        if: inputs.release_type == 'latest'
        run: pnpm changeset version

      - name: Publish (latest)
        if: inputs.release_type == 'latest'
        run: pnpm changeset publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit, tag & push version changes (latest)
        if: inputs.release_type == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages (latest)" --allow-empty
          git push --follow-tags
