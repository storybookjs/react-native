packages:
  - 'packages/*'
  - 'examples/*'
  - 'docs'
  - 'tests'
linkWorkspacePackages: true
ignoreScripts: true
nodeLinker: hoisted
shamefullyHoist: true
minimumReleaseAge: 1340
# First-party Storybook releases are intentionally adopted before minimumReleaseAge elapses.
minimumReleaseAgeExclude:
  - storybook
  - '@storybook/*'
overrides:
  # Required for notes security: react-native-markdown-display@7.0.2 is latest and still resolves markdown-it@10 by default.
  markdown-it: 14.3.3
  # Required for Storybook docgen behavior; newer react-docgen-typescript versions change functionality.
  react-docgen-typescript: 2.2.2
  # Required until Docusaurus updates its webpack plugins: copy-webpack-plugin@11 and css-minimizer-webpack-plugin@5 only allow serialize-javascript@^6.
  serialize-javascript: 7.1.3
  # Docs-only: @docusaurus/core@3.10.2 (latest) allows tinypool@^1, but the tinypool advisories are only patched in 2.1.2+.
  '@docusaurus/core>tinypool': 2.2.0
  # Docs-only: cssnano@6 (via Docusaurus) allows colord@^2.9.3, but pnpm keeps the vulnerable 2.9.3 locked; patched in 2.9.4+.
  postcss-colormin>colord: 2.13.0
  postcss-minify-gradients>colord: 2.13.0
  # Test-only: jest@30.5.2 (latest) allows glob@^13 and test-exclude@7 (via babel-plugin-istanbul) allows glob@^10/minimatch@^9,
  # but the glob and minimatch advisories are only patched in glob@14.0.2+ and minimatch@11.0.1+.
  '@jest/reporters>glob': 14.0.6
  jest-config>glob: 14.0.6
  jest-runtime>glob: 14.0.6
  test-exclude>glob: 14.0.6
  test-exclude>minimatch: 11.0.8
  # Web Storybook tooling: @storybook/react-vite@11 peers on @joshwooding/vite-plugin-react-docgen-typescript@^0.7 (glob@^13); 0.8+ drops glob but is outside that range.
  '@joshwooding/vite-plugin-react-docgen-typescript>glob': 14.0.6
  # Expo CLI tooling: @expo/fingerprint@0.21.10 (latest) allows minimatch@^10, but the minimatch advisory is only patched in 11.0.1+.
  '@expo/fingerprint>minimatch': 11.0.8
  # Required until webpack-dev-server drops sockjs: sockjs@0.3.24 pins uuid@^8, but the uuid advisory is only patched in 11.1.1+.
  sockjs>uuid: 11.1.1
  # Required until Expo's xcode dependency updates: xcode@3.0.1 pins uuid@^7, but the uuid advisory is only patched in 11.1.1+.
  xcode>uuid: 11.1.1
  # Reanimated must be a singleton in React Native apps; mixed versions crash at runtime.
  react-native-reanimated: 4.7.1
  # expo-router and the examples can resolve different versions, we need to override to not get duplicate native deps
  react-native-safe-area-context: '5.11.1'
