appId: host.exp.Exponent
name: Take screenshots of all Storybook stories
---
- stopApp: host.exp.Exponent

# Story 0
- openLink: 'exp://127.0.0.1:8081/--/?STORYBOOK_STORY_ID=actionexample-actions--basic'
